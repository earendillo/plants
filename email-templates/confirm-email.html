<div style="background-color: #191c15; padding: 40px 16px; font-family: 'Plus Jakarta Sans', Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 480px; margin: 0 auto;">
    <tr>
      <td style="background-color: #222820; border-radius: 16px; padding: 40px 36px;">

        <!-- Logo -->
        <img
          src="https://leafmo.app/leafmo-logo.svg"
          alt="LeafMo"
          width="52"
          style="display: block; margin-bottom: 28px;"
        />

        <!-- Heading -->
        <h2 style="
          margin: 0 0 14px 0;
          font-size: 22px;
          font-weight: 700;
          color: #e5e9de;
          line-height: 1.3;
          letter-spacing: -0.02em;
        ">
          Confirm your email
        </h2>

        <!-- Body -->
        <p style="
          margin: 0 0 32px 0;
          font-size: 15px;
          line-height: 1.65;
          color: #9ba090;
        ">
          Thanks for joining LeafMo. Click the button below to verify your address and start tracking and sharing plant care.
        </p>

        <!-- CTA Button -->
        <a
          href="{{ .ConfirmationURL }}"
          style="
            display: inline-block;
            background-color: #CFEE9E;
            color: #141a0d;
            padding: 13px 24px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: -0.01em;
          "
        >
          Open LeafMo
        </a>

        <!-- Divider -->
        <hr style="border: none; border-top: 1px solid #2b3026; margin: 36px 0 24px;" />

        <!-- Footer -->
        <p style="margin: 0; font-size: 13px; color: #8a9082; line-height: 1.5;">
          Plant care, shared simply.<br />
          If you didn't create an account, you can safely ignore this email.
        </p>

      </td>
    </tr>
  </table>

</div>
